version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobridge_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_mediafiles:/app/media
      - backend_data:/app/persistent_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  backend_staticfiles:
  backend_mediafiles:
  backend_data:

