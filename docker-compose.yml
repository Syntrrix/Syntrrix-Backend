version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agrobridge_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agro_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../agro_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrobridge_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-o-ut=c-(*&@+i$d3@wanni5+_&zvno%iahsq*_w3%4^9@p26=w
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - DB_ENGINE=django.db.backends.mysql
      - DB_NAME=agro_db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
      - CORS_ALLOW_ALL_ORIGINS=True
    volumes:
      - .:/app
      - backend_staticfiles:/app/staticfiles
      - backend_mediafiles:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  backend_staticfiles:
  backend_mediafiles:
